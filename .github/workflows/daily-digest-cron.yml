name: Daily Digest Telegram Report Cron

on:
  schedule:
    # 16:00 UTC = 22:00 (10:00 PM) Bangladesh Standard Time (BST, UTC+6)
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  trigger-daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Digest Telegram Report Endpoint
        run: |
          echo "Triggering Daily Digest Report at 10:00 PM BST..."
          RESPONSE=$(curl -s -S --retry 3 --retry-delay 5 https://industrymentor.net/api/cron-daily-digest)
          echo "Response: $RESPONSE"
